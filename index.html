<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan dan Reminder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    /* Sembunyikan scrollbar untuk navigasi mobile tapi tetap bisa di-scroll */
    nav::-webkit-scrollbar { display: none; }
    nav { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col md:flex-row min-h-screen">

  <!-- Desktop Sidebar -->
  <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 p-4 fixed h-full z-10">
    <div class="flex items-center gap-3 mb-8 px-2">
      <div class="bg-blue-600 text-white p-2 rounded-xl"><i class="fa-solid fa-notes-medical text-lg"></i></div>
      <h1 class="font-bold text-lg">Catatan & Reminder</h1>
    </div>
    <nav class="flex flex-col gap-1">
      <button onclick="switchTab('dashboard')" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-blue-600 bg-blue-50 transition"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</button>
      <button onclick="switchTab('notes')" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 transition"><i class="fa-solid fa-book w-5"></i> Catatan</button>
      <button onclick="switchTab('reminders')" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 transition"><i class="fa-solid fa-bell w-5"></i> Reminder</button>
      <button onclick="switchTab('tasks')" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 transition"><i class="fa-solid fa-tasks w-5"></i> Tugas</button>
      <button onclick="switchTab('agenda')" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 transition"><i class="fa-solid fa-calendar-days w-5"></i> Agenda</button>
      <button onclick="switchTab('calendar')" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 transition"><i class="fa-solid fa-calendar w-5"></i> Kalender</button>
      <button onclick="switchTab('search')" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 transition"><i class="fa-solid fa-search w-5"></i> Pencarian</button>
      <button onclick="switchTab('settings')" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 transition"><i class="fa-solid fa-gear w-5"></i> Pengaturan</button>
    </nav>
  </aside>

  <!-- Mobile Bottom Navigation (Scrollable) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex p-2 z-20 overflow-x-auto gap-2">
    <button onclick="switchTab('dashboard')" class="mob-btn flex flex-col items-center justify-center text-blue-600 text-xs w-16 shrink-0"><i class="fa-solid fa-chart-pie text-base mb-1"></i><span>Home</span></button>
    <button onclick="switchTab('notes')" class="mob-btn flex flex-col items-center justify-center text-gray-500 text-xs w-16 shrink-0"><i class="fa-solid fa-book text-base mb-1"></i><span>Catatan</span></button>
    <button onclick="switchTab('reminders')" class="mob-btn flex flex-col items-center justify-center text-gray-500 text-xs w-16 shrink-0"><i class="fa-solid fa-bell text-base mb-1"></i><span>Reminder</span></button>
    <button onclick="switchTab('tasks')" class="mob-btn flex flex-col items-center justify-center text-gray-500 text-xs w-16 shrink-0"><i class="fa-solid fa-tasks text-base mb-1"></i><span>Tugas</span></button>
    <button onclick="switchTab('agenda')" class="mob-btn flex flex-col items-center justify-center text-gray-500 text-xs w-16 shrink-0"><i class="fa-solid fa-calendar-days text-base mb-1"></i><span>Agenda</span></button>
    <button onclick="switchTab('calendar')" class="mob-btn flex flex-col items-center justify-center text-gray-500 text-xs w-16 shrink-0"><i class="fa-solid fa-calendar text-base mb-1"></i><span>Kalender</span></button>
    <button onclick="switchTab('search')" class="mob-btn flex flex-col items-center justify-center text-gray-500 text-xs w-16 shrink-0"><i class="fa-solid fa-search text-base mb-1"></i><span>Cari</span></button>
    <button onclick="switchTab('settings')" class="mob-btn flex flex-col items-center justify-center text-gray-500 text-xs w-16 shrink-0"><i class="fa-solid fa-gear text-base mb-1"></i><span>Setelan</span></button>
  </nav>

  <!-- Main Content Container -->
  <main class="flex-1 md:ml-64 p-4 md:p-8 pb-24 md:pb-8 max-w-7xl w-full">
    <header class="flex justify-between items-center mb-6">
      <div>
        <h2 id="page-title" class="text-2xl font-bold">Dashboard</h2>
        <p id="current-date-label" class="text-sm text-gray-500">Sistem Terintegrasi Google Spreadsheet</p>
      </div>
    </header>

    <div id="error-banner" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl mb-4 flex justify-between items-center">
      <span id="error-message">Koneksi ke server bermasalah.</span>
      <button onclick="loadAppData()" class="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold transition hover:bg-red-700">COBA LAGI</button>
    </div>

    <!-- TAB: DASHBOARD -->
    <section id="tab-dashboard" class="tab-content space-y-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
          <p class="text-xs text-gray-500 font-medium">TOTAL CATATAN</p>
          <h3 id="stat-notes" class="text-2xl font-bold mt-1">-</h3>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
          <p class="text-xs text-gray-500 font-medium">REMINDER HARI INI</p>
          <h3 id="stat-reminders" class="text-2xl font-bold mt-1">-</h3>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
          <p class="text-xs text-gray-500 font-medium">TUGAS HARI INI</p>
          <h3 id="stat-tasks" class="text-2xl font-bold mt-1">-</h3>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
          <p class="text-xs text-gray-500 font-medium">TUGAS TERLAMBAT</p>
          <h3 id="stat-overdue" class="text-2xl font-bold mt-1 text-red-600">-</h3>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
          <h3 class="font-bold text-base mb-4 flex items-center gap-2"><i class="fa-solid fa-calendar-check text-blue-600"></i> Ringkasan Hari Ini</h3>
          <div id="daily-summary-box" class="space-y-3 text-sm"><p class="text-gray-500">Memuat...</p></div>
        </div>
        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
          <h3 class="font-bold text-base mb-4 flex items-center gap-2"><i class="fa-solid fa-bolt text-amber-500"></i> Focus</h3>
          <div id="focus-list-box" class="space-y-3"><p class="text-gray-500 text-sm">Memuat...</p></div>
        </div>
      </div>
    </section>

    <!-- TAB: NOTES -->
    <section id="tab-notes" class="tab-content hidden space-y-4">
      <div class="flex flex-col md:flex-row justify-between gap-4 items-center bg-white p-4 rounded-2xl border shadow-sm">
        <div class="flex items-center gap-2 w-full md:w-auto">
          <input type="checkbox" id="select-all-notes" onclick="toggleSelectAll('notes')" class="w-4 h-4 rounded cursor-pointer">
          <label for="select-all-notes" class="text-sm font-medium cursor-pointer select-none">Pilih Semua</label>
          <button onclick="deleteSelected('notes')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-xl text-base ml-2 transition" title="Hapus Terpilih"><i class="fa-solid fa-trash"></i></button>
        </div>
        <div class="flex gap-2 w-full md:w-auto">
          <input type="text" id="note-search" oninput="renderNotes()" placeholder="Cari catatan..." class="px-4 py-2 border rounded-xl w-full md:w-64 outline-none focus:border-blue-600 text-sm">
          <button onclick="openModal('note')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition">+ Buat Catatan</button>
        </div>
      </div>
      <div id="notes-container" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </section>

    <!-- TAB: REMINDERS -->
    <section id="tab-reminders" class="tab-content hidden space-y-4">
      <div class="flex justify-between items-center bg-white p-4 rounded-2xl border shadow-sm">
        <div class="flex items-center gap-2">
          <input type="checkbox" id="select-all-reminders" onclick="toggleSelectAll('reminders')" class="w-4 h-4 rounded cursor-pointer">
          <label for="select-all-reminders" class="text-sm font-medium cursor-pointer select-none">Pilih Semua</label>
          <button onclick="deleteSelected('reminders')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-xl text-base ml-2 transition" title="Hapus Terpilih"><i class="fa-solid fa-trash"></i></button>
        </div>
        <button onclick="openModal('reminder')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">+ Reminder Baru</button>
      </div>
      <div id="reminders-container" class="space-y-3"></div>
    </section>

    <!-- TAB: TASKS -->
    <section id="tab-tasks" class="tab-content hidden space-y-4">
      <div class="flex justify-between items-center bg-white p-4 rounded-2xl border shadow-sm">
        <div class="flex items-center gap-2">
          <input type="checkbox" id="select-all-tasks" onclick="toggleSelectAll('tasks')" class="w-4 h-4 rounded cursor-pointer">
          <label for="select-all-tasks" class="text-sm font-medium cursor-pointer select-none">Pilih Semua</label>
          <button onclick="deleteSelected('tasks')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-xl text-base ml-2 transition" title="Hapus Terpilih"><i class="fa-solid fa-trash"></i></button>
        </div>
        <button onclick="openModal('task')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">+ Tugas Baru</button>
      </div>
      <div id="tasks-container" class="space-y-3"></div>
    </section>

    <!-- TAB: AGENDA -->
    <section id="tab-agenda" class="tab-content hidden space-y-4">
      <div class="flex justify-between items-center bg-white p-4 rounded-2xl border shadow-sm">
        <div class="flex items-center gap-2">
          <input type="checkbox" id="select-all-agenda" onclick="toggleSelectAll('agenda')" class="w-4 h-4 rounded cursor-pointer">
          <label for="select-all-agenda" class="text-sm font-medium cursor-pointer select-none">Pilih Semua</label>
          <button onclick="deleteSelected('agenda')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-xl text-base ml-2 transition" title="Hapus Terpilih"><i class="fa-solid fa-trash"></i></button>
        </div>
        <button onclick="openModal('agenda')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">+ Agenda Baru</button>
      </div>
      <div id="agenda-container" class="space-y-3"></div>
    </section>

    <!-- CALENDAR -->
    <section id="tab-calendar" class="tab-content hidden space-y-4">
      <div class="bg-white p-6 rounded-2xl border shadow-sm">
        <h3 class="font-bold text-lg mb-4">Kalender Bulanan</h3>
        <div id="calendar-grid" class="grid grid-cols-7 gap-2 text-center text-sm"></div>
      </div>
    </section>

    <!-- SEARCH -->
    <section id="tab-search" class="tab-content hidden space-y-4">
      <div class="flex gap-2 w-full max-w-xl">
        <input type="text" id="global-keyword" placeholder="Ketik kata kunci pencarian..." class="px-4 py-2 border rounded-xl flex-1 outline-none focus:border-blue-600 text-sm">
        <button onclick="executeGlobalSearch()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl text-sm font-medium transition">Cari</button>
      </div>
      <div id="global-search-results" class="space-y-3 max-w-3xl"></div>
    </section>

    <!-- SETTINGS -->
    <section id="tab-settings" class="tab-content hidden space-y-4">
      <div class="bg-white p-6 rounded-2xl border shadow-sm max-w-xl">
        <h3 class="font-bold text-lg mb-4">Pengaturan Aplikasi</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Web App API URL</label>
            <input type="text" id="api-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-4 py-2 border rounded-xl text-sm outline-none focus:border-blue-600">
          </div>
          <button onclick="saveApiUrl()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">Simpan URL API</button>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL -->
  <div id="app-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
      <h3 id="modal-title" class="font-bold text-lg mb-4">Form Input</h3>
      <div id="modal-body" class="space-y-4"></div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeModal()" class="px-4 py-2 border rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 transition">Batal</button>
        <button onclick="submitModalForm()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">Simpan</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-16 md:bottom-6 right-6 bg-gray-900 text-white px-4 py-3 rounded-xl text-sm shadow-xl z-50 transition">Berhasil</div>

  <script>
    let API_URL = localStorage.getItem('GAS_API_URL') || '';
    let appDataCache = { notes: [], reminders: [], tasks: [], agenda: [], dashboard: {} };
    let currentModalType = '';
    let editRecordId = null;

    document.getElementById('api-url-input').value = API_URL;

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      document.getElementById('page-title').innerText = tabId.charAt(0).toUpperCase() + tabId.slice(1);
      
      // Update styling menu nav
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-blue-600', 'bg-blue-50');
        btn.classList.add('text-gray-600');
      });
      document.querySelectorAll('.mob-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-gray-500');
      });

      const activeNav = document.querySelector(`.nav-btn[onclick="switchTab('${tabId}')"]`);
      if(activeNav) {
        activeNav.classList.remove('text-gray-600');
        activeNav.classList.add('text-blue-600', 'bg-blue-50');
      }
      
      const activeMob = document.querySelector(`.mob-btn[onclick="switchTab('${tabId}')"]`);
      if(activeMob) {
        activeMob.classList.remove('text-gray-500');
        activeMob.classList.add('text-blue-600');
      }
      
      if (tabId === 'dashboard') loadAppData();
      if (tabId === 'notes') fetchNotes();
      if (tabId === 'reminders') fetchReminders();
      if (tabId === 'tasks') fetchTasks();
      if (tabId === 'agenda') fetchAgenda();
      if (tabId === 'calendar') renderCalendarView();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    }

    function apiCall(action, method = 'GET', data = null) {
      if (!API_URL) {
        document.getElementById('error-banner').classList.remove('hidden');
        document.getElementById('error-message').innerText = 'URL API belum diset di Pengaturan.';
        return Promise.reject('API URL belum diatur');
      }
      
      let url = API_URL + '?action=' + action;
      let options = { method: method, mode: 'cors' };
      if (method === 'POST') {
        options.body = JSON.stringify(data);
      }

      document.getElementById('error-banner').classList.add('hidden');

      return fetch(url, options)
        .then(res => res.json())
        .catch(err => {
          document.getElementById('error-banner').classList.remove('hidden');
          document.getElementById('error-message').innerText = 'Koneksi ke server gagal. Pastikan URL API benar.';
          throw err;
        });
    }

    function loadAppData() {
      apiCall('dashboard').then(res => {
        if (res && res.success) renderDashboard(res.data);
      });
    }

    function renderDashboard(data) {
      document.getElementById('stat-notes').innerText = data.stats.total_notes;
      document.getElementById('stat-reminders').innerText = data.stats.reminders_today;
      document.getElementById('stat-tasks').innerText = data.stats.tasks_today;
      document.getElementById('stat-overdue').innerText = data.stats.overdue_tasks;
      const ds = data.daily_summary;
      document.getElementById('daily-summary-box').innerHTML = `
        <p class="font-semibold text-gray-800">${ds.date}</p>
        <div class="grid grid-cols-2 gap-2 mt-2">
          <div class="bg-gray-50 p-2 rounded-lg">Agenda: <b>${ds.agenda_count}</b></div>
          <div class="bg-gray-50 p-2 rounded-lg">Reminder: <b>${ds.reminder_count}</b></div>
          <div class="bg-gray-50 p-2 rounded-lg">Tugas: <b>${ds.task_count}</b></div>
          <div class="bg-gray-50 p-2 rounded-lg text-red-600">Terlambat: <b>${ds.overdue_count}</b></div>
        </div>
      `;
      const focusBox = document.getElementById('focus-list-box');
      focusBox.innerHTML = data.focus_list.length === 0 ? '<p class="text-gray-500 text-sm">Tidak ada tugas mendesak.</p>' :
        data.focus_list.map(i => `<div class="p-3 bg-gray-50 rounded-xl border flex justify-between text-sm"><span>${i.title}</span><span class="text-xs text-gray-500">${i.deadline || ''}</span></div>`).join('');
    }

    function fetchNotes() { apiCall('notes').then(res => { if(res.success) { appDataCache.notes = res.data; renderNotes(); } }); }
    function renderNotes() {
      const keyword = (document.getElementById('note-search')?.value || '').toLowerCase();
      const container = document.getElementById('notes-container');
      const filtered = appDataCache.notes.filter(n => n.title.toLowerCase().includes(keyword) || n.content.toLowerCase().includes(keyword));
      
      container.innerHTML = filtered.map(n => `
        <div class="bg-white p-4 rounded-2xl border shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded font-medium">${n.category}</span>
              <input type="checkbox" value="${n.id}" onchange="updateMasterCheckbox('notes')" class="row-checkbox notes-cb w-4 h-4 rounded cursor-pointer">
            </div>
            <h4 class="font-bold text-base mt-2">${n.title}</h4>
            <p class="text-sm text-gray-600 mt-1">${n.content}</p>
          </div>
          <div class="flex justify-end gap-2 mt-4 pt-2 border-t text-xs">
            <button onclick='openModal("note", ${JSON.stringify(n)})' class="text-blue-600 hover:text-blue-800 font-medium transition">Edit</button>
            <button onclick='deleteRecord("note", "${n.id}")' class="text-red-600 hover:text-red-800 font-medium transition">Hapus</button>
          </div>
        </div>
      `).join('');
      updateMasterCheckbox('notes');
    }

    function fetchReminders() { apiCall('reminders').then(res => { if(res.success) { appDataCache.reminders = res.data; renderReminders(); } }); }
    function renderReminders() {
      const container = document.getElementById('reminders-container');
      container.innerHTML = appDataCache.reminders.map(r => `
        <div class="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center text-sm">
          <div class="flex items-center gap-3">
            <input type="checkbox" value="${r.id}" onchange="updateMasterCheckbox('reminders')" class="row-checkbox reminders-cb w-4 h-4 rounded cursor-pointer">
            <div>
              <span class="text-xs bg-purple-50 text-purple-600 px-2 py-0.5 rounded font-medium">${r.status} | ${r.reminder_date} ${r.reminder_time}</span>
              <h4 class="font-bold mt-1 text-base">${r.title}</h4>
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick='openModal("reminder", ${JSON.stringify(r)})' class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-medium transition">Edit</button>
            <button onclick='deleteRecord("reminder", "${r.id}")' class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium transition">Hapus</button>
          </div>
        </div>
      `).join('');
      updateMasterCheckbox('reminders');
    }

    function fetchTasks() { apiCall('tasks').then(res => { if(res.success) { appDataCache.tasks = res.data; renderTasks(); } }); }
    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = appDataCache.tasks.map(t => `
        <div class="bg-white p-4 rounded-2xl border shadow-sm space-y-2">
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
              <input type="checkbox" value="${t.id}" onchange="updateMasterCheckbox('tasks')" class="row-checkbox tasks-cb w-4 h-4 rounded cursor-pointer">
              <h4 class="font-bold text-base">${t.title}</h4>
            </div>
            <span class="text-xs px-2 py-1 rounded font-medium ${t.status === 'DONE' ? 'bg-green-50 text-green-600' : 'bg-blue-50 text-blue-600'}">${t.status}</span>
          </div>
          <p class="text-sm text-gray-500 ml-7">Deadline: ${t.deadline || '-'}</p>
          <div class="flex justify-end gap-3 pt-3 text-sm border-t mt-3">
            <button onclick='openModal("task", ${JSON.stringify(t)})' class="text-blue-600 hover:text-blue-800 font-medium transition">Edit</button>
            <button onclick='deleteRecord("task", "${t.id}")' class="text-red-600 hover:text-red-800 font-medium transition">Hapus</button>
          </div>
        </div>
      `).join('');
      updateMasterCheckbox('tasks');
    }

    function fetchAgenda() { apiCall('agenda').then(res => { if(res.success) { appDataCache.agenda = res.data; renderAgenda(); } }); }
    function renderAgenda() {
      const container = document.getElementById('agenda-container');
      container.innerHTML = appDataCache.agenda.map(a => `
        <div class="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center text-sm">
          <div class="flex items-center gap-3">
            <input type="checkbox" value="${a.id}" onchange="updateMasterCheckbox('agenda')" class="row-checkbox agenda-cb w-4 h-4 rounded cursor-pointer">
            <div>
              <span class="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded font-medium">${a.date} | ${a.start_time} - ${a.end_time}</span>
              <h4 class="font-bold mt-1 text-base">${a.title}</h4>
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick='openModal("agenda", ${JSON.stringify(a)})' class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-medium transition">Edit</button>
            <button onclick='deleteRecord("agenda", "${a.id}")' class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium transition">Hapus</button>
          </div>
        </div>
      `).join('');
      updateMasterCheckbox('agenda');
    }

    function toggleSelectAll(type) {
      const master = document.getElementById('select-all-' + type);
      const boxes = document.querySelectorAll('.' + type + '-cb');
      boxes.forEach(b => b.checked = master.checked);
    }

    function updateMasterCheckbox(type) {
      const master = document.getElementById('select-all-' + type);
      const boxes = document.querySelectorAll('.' + type + '-cb');
      const checkedBoxes = document.querySelectorAll('.' + type + '-cb:checked');
      if (master) {
        master.checked = boxes.length > 0 && boxes.length === checkedBoxes.length;
      }
    }

    function deleteSelected(type) {
      const boxes = document.querySelectorAll('.' + type + '-cb');
      const ids = [];
      boxes.forEach(b => { if(b.checked) ids.push(b.value); });
      
      if (ids.length === 0) { 
        showToast('Pilih minimal satu data untuk dihapus'); 
        return; 
      }
      
      if (!window.confirm(`PERINGATAN!\n\nApakah Anda yakin ingin menghapus ${ids.length} data yang dipilih?\nData yang dihapus tidak dapat dikembalikan.`)) {
        return;
      }

      let map = { notes: 'deleteBatchNotes', reminders: 'deleteBatchReminders', tasks: 'deleteBatchTasks', agenda: 'deleteBatchAgenda' };
      apiCall(type, 'POST', { action: map[type], data: { ids: ids } }).then(res => {
        if (res && res.success) {
          showToast('Data terpilih berhasil dihapus');
          const master = document.getElementById('select-all-' + type);
          if (master) master.checked = false; // Reset master checkbox
          switchTab(type); // Refresh view
        } else {
          showToast(res.message || 'Gagal menghapus');
        }
      });
    }

    function renderCalendarView() {
      const grid = document.getElementById('calendar-grid');
      const days = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
      grid.innerHTML = days.map(d=>`<div class="font-bold text-xs text-gray-500">${d}</div>`).join('') +
        Array.from({length:31}, (_,i)=>`<div class="border border-gray-100 rounded-xl p-2 h-16 bg-white text-sm"><span class="font-bold">${i+1}</span></div>`).join('');
    }

    function executeGlobalSearch() {
      apiCall('search&keyword=' + encodeURIComponent(document.getElementById('global-keyword').value)).then(res => {
        if(res.success) {
          document.getElementById('global-search-results').innerHTML = res.data.length === 0 ? '<p class="text-gray-500 text-sm">Tidak ditemukan.</p>' :
            res.data.map(i => `<div class="bg-white p-3 rounded-xl border border-gray-100 text-sm flex justify-between items-center shadow-sm"><span class="font-medium"><span class="text-blue-600 font-bold mr-2">[${i.type}]</span>${i.title}</span><span class="text-xs text-gray-500">${i.detail}</span></div>`).join('');
        }
      });
    }

    function openModal(type, data = null) {
      currentModalType = type;
      editRecordId = data ? data.id : null;
      document.getElementById('app-modal').classList.remove('hidden');
      document.getElementById('modal-title').innerText = (editRecordId ? 'Edit ' : 'Tambah ') + type.toUpperCase();
      const body = document.getElementById('modal-body');
      
      if (type === 'note') {
        body.innerHTML = `
          <label class="block text-xs font-semibold text-gray-600 mb-1">Judul Catatan</label>
          <input type="text" id="m-title" value="${data ? data.title : ''}" placeholder="Judul..." class="w-full px-4 py-2 border rounded-xl text-sm mb-3 outline-none focus:border-blue-600">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Isi Catatan</label>
          <textarea id="m-content" placeholder="Isi..." class="w-full px-4 py-2 border rounded-xl text-sm h-28 mb-3 outline-none focus:border-blue-600">${data ? data.content : ''}</textarea>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Kategori</label>
          <input type="text" id="m-category" value="${data ? data.category : ''}" placeholder="Kategori..." class="w-full px-4 py-2 border rounded-xl text-sm outline-none focus:border-blue-600">
        `;
      } else if (type === 'reminder') {
        body.innerHTML = `
          <label class="block text-xs font-semibold text-gray-600 mb-1">Judul Reminder</label>
          <input type="text" id="m-title" value="${data ? data.title : ''}" placeholder="Judul..." class="w-full px-4 py-2 border rounded-xl text-sm mb-3 outline-none focus:border-blue-600">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Tanggal</label>
          <input type="date" id="m-date" value="${data ? data.reminder_date : ''}" class="w-full px-4 py-2 border rounded-xl text-sm mb-3 outline-none focus:border-blue-600">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Jam</label>
          <input type="time" id="m-time" value="${data ? data.reminder_time : ''}" class="w-full px-4 py-2 border rounded-xl text-sm outline-none focus:border-blue-600">
        `;
      } else if (type === 'task') {
        body.innerHTML = `
          <label class="block text-xs font-semibold text-gray-600 mb-1">Judul Tugas</label>
          <input type="text" id="m-title" value="${data ? data.title : ''}" placeholder="Judul..." class="w-full px-4 py-2 border rounded-xl text-sm mb-3 outline-none focus:border-blue-600">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Batas Waktu (Deadline)</label>
          <input type="date" id="m-deadline" value="${data ? data.deadline : ''}" class="w-full px-4 py-2 border rounded-xl text-sm outline-none focus:border-blue-600">
        `;
      } else if (type === 'agenda') {
        body.innerHTML = `
          <label class="block text-xs font-semibold text-gray-600 mb-1">Judul Agenda</label>
          <input type="text" id="m-title" value="${data ? data.title : ''}" placeholder="Judul..." class="w-full px-4 py-2 border rounded-xl text-sm mb-3 outline-none focus:border-blue-600">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Tanggal</label>
          <input type="date" id="m-date" value="${data ? data.date : ''}" class="w-full px-4 py-2 border rounded-xl text-sm mb-3 outline-none focus:border-blue-600">
          <div class="flex gap-2">
            <div class="w-1/2">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Jam Mulai</label>
              <input type="time" id="m-start" value="${data ? data.start_time : ''}" class="w-full px-4 py-2 border rounded-xl text-sm outline-none focus:border-blue-600">
            </div>
            <div class="w-1/2">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Jam Selesai</label>
              <input type="time" id="m-end" value="${data ? data.end_time : ''}" class="w-full px-4 py-2 border rounded-xl text-sm outline-none focus:border-blue-600">
            </div>
          </div>
        `;
      }
    }

    function closeModal() { document.getElementById('app-modal').classList.add('hidden'); }

    function submitModalForm() {
      let actionPrefix = editRecordId ? 'update' : 'create';
      let actionMap = { note: actionPrefix + 'Note', reminder: actionPrefix + 'Reminder', task: actionPrefix + 'Task', agenda: actionPrefix + 'Agenda' };
      let data = { id: editRecordId };
      
      if (currentModalType === 'note') {
        data.title = document.getElementById('m-title').value;
        data.content = document.getElementById('m-content').value;
        data.category = document.getElementById('m-category').value || 'Umum';
      } else if (currentModalType === 'reminder') {
        data.title = document.getElementById('m-title').value;
        data.reminder_date = document.getElementById('m-date').value;
        data.reminder_time = document.getElementById('m-time').value;
      } else if (currentModalType === 'task') {
        data.title = document.getElementById('m-title').value;
        data.deadline = document.getElementById('m-deadline').value;
      } else if (currentModalType === 'agenda') {
        data.title = document.getElementById('m-title').value;
        data.date = document.getElementById('m-date').value;
        data.start_time = document.getElementById('m-start').value;
        data.end_time = document.getElementById('m-end').value;
      }

      apiCall(currentModalType === 'note' ? 'notes' : (currentModalType === 'reminder' ? 'reminders' : (currentModalType === 'task' ? 'tasks' : 'agenda')), 'POST', { action: actionMap[currentModalType], data: data })
        .then(res => {
          if (res && res.success) {
            showToast(res.message);
            closeModal();
            switchTab(currentModalType === 'note' ? 'notes' : (currentModalType === 'reminder' ? 'reminders' : (currentModalType === 'task' ? 'tasks' : 'agenda')));
          }
        });
    }

    function deleteRecord(type, id) {
      if (!window.confirm('PERINGATAN!\n\nYakin ingin menghapus data ini?')) return;
      let map = { note: 'deleteNote', reminder: 'deleteReminder', task: 'deleteTask', agenda: 'deleteAgenda' };
      let endpoint = type === 'note' ? 'notes' : (type === 'reminder' ? 'reminders' : (type === 'task' ? 'tasks' : 'agenda'));
      apiCall(endpoint, 'POST', { action: map[type], data: { id: id } }).then(res => {
        if (res && res.success) {
          showToast('Data berhasil dihapus');
          switchTab(endpoint);
        } else {
          showToast(res.message || 'Gagal menghapus data');
        }
      });
    }

    function saveApiUrl() {
      API_URL = document.getElementById('api-url-input').value.trim();
      localStorage.setItem('GAS_API_URL', API_URL);
      showToast('URL API disimpan');
      loadAppData();
    }

    window.onload = function() { 
      if (API_URL) loadAppData(); 
      else switchTab('settings'); // Arahkan ke pengaturan jika belum ada URL
    };
  </script>
</body>
</html>
